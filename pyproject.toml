[project]
name = "historybot"
version = "0.1.0"
description = "Evidence-first historical research platform orchestrated by LangGraph"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "python-dateutil>=2.9",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
ocr = ["rapidocr-onnxruntime>=1.4"]
vision = ["Pillow>=10", "sentencepiece>=0.2", "torch>=2.0", "transformers>=4.40,<5"]
memory = ["mem0ai>=2.0.20", "sentence-transformers>=3.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "playwright>=1.62.0",
]
